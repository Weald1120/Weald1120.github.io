<style>
    :root {
        --ink: #241f18;
        --ink-2: #4a4238;
        --muted: #8e8677;
        --line: rgba(150, 120, 60, .13);
        --amber: #F0A30A;
        --amber-lt: #FFC742;
        --coral: #E0663F;
        --coral-lt: #F09570;
        --sage: #6E9E7A;
        --sage-lt: #9CC19F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        background: #FDFBF5;
        color: var(--ink);
        line-height: 1.7;
        min-height: 100vh;
        padding: max(28px, env(safe-area-inset-top)) 18px max(36px, env(safe-area-inset-bottom));
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* 背景暖光 */
    .glow {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
            radial-gradient(58% 42% at 12% -4%, rgba(255, 208, 120, .55), transparent 68%),
            radial-gradient(52% 40% at 96% 22%, rgba(255, 226, 178, .48), transparent 70%),
            radial-gradient(62% 46% at 50% 108%, rgba(255, 196, 128, .34), transparent 72%);
    }
    .wrap {
        position: relative; z-index: 1;
        max-width: 560px; margin: 0 auto;
        min-height: calc(100dvh - 70px);
        display: flex; flex-direction: column;
    }

    /* ---------- 头部 ---------- */
    .hero { text-align: center; padding: 14px 0 26px; }
    .pill {
        display: inline-block;
        font-size: 12px; font-weight: 600; letter-spacing: .6px;
        color: #A9761A;
        background: rgba(255, 246, 226, .9);
        border: 1px solid rgba(224, 168, 50, .32);
        padding: 5px 14px; border-radius: 999px;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 2px 10px rgba(200, 150, 40, .10);
    }
    .hero h1 {
        margin-top: 18px;
        font-size: clamp(28px, 8.2vw, 38px);
        font-weight: 800; letter-spacing: -.5px; line-height: 1.28;
        color: #1E1A14;
    }
    .hero h1 em {
        font-style: normal;
        background: linear-gradient(100deg, #F0A30A 6%, #FF8A3D 96%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero .sub {
        margin-top: 12px; font-size: 15px; color: var(--muted); letter-spacing: .2px;
    }

    /* ---------- 微信名片 ---------- */
    .wx {
        display: flex; align-items: center; gap: 12px;
        margin: 0 0 26px; padding: 12px 16px;
        background: rgba(255, 255, 255, .74);
        border: 1px solid rgba(255, 255, 255, .9);
        border-radius: 18px;
        box-shadow: 0 8px 26px rgba(160, 120, 40, .10), 0 1px 0 rgba(255, 255, 255, .9) inset;
        backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    }
    .wx img {
        width: 50px; height: 50px; border-radius: 50%; flex: none;
        object-fit: cover; object-position: center 18%;
        border: 1.5px solid rgba(240, 163, 10, .45);
        box-shadow: 0 2px 8px rgba(180, 120, 20, .18);
    }
    .wx .info { flex: 1; min-width: 0; }
    .wx .nm { font-size: 14.5px; font-weight: 700; color: #2A241B; line-height: 1.35; }
    .wx .id {
        display: flex; align-items: center; gap: 8px;
        font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 3px;
    }
    .wx .id span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wx .id b { color: var(--ink-2); letter-spacing: .2px; }
    .wx .cp {
        flex: none; font-size: 11.5px; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, var(--amber-lt), var(--amber));
        padding: 4px 11px; border-radius: 999px; cursor: pointer;
        box-shadow: 0 2px 8px rgba(220, 145, 0, .30);
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .wx .cp:active { transform: scale(.94); }

    /* ---------- 卡片 ---------- */
    .cards { display: flex; flex-direction: column; gap: 16px; }
    .card {
        position: relative;
        display: flex; align-items: center; gap: 15px;
        padding: 20px 18px;
        text-decoration: none; color: inherit;
        background: rgba(255, 255, 255, .76);
        border: 1px solid rgba(255, 255, 255, .95);
        border-radius: 20px;
        box-shadow: 0 8px 28px rgba(160, 120, 40, .09), 0 1px 0 rgba(255, 255, 255, .95) inset;
        backdrop-filter: blur(18px) saturate(1.35); -webkit-backdrop-filter: blur(18px) saturate(1.35);
        overflow: hidden;
        transition: transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s ease;
        opacity: 0; transform: translateY(14px);
    }
    .card.in { animation: rise .52s cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(160, 120, 40, .15); }
    .card:active { transform: scale(.985); }

    /* 左侧色条 */
    .card::before {
        content: ""; position: absolute; left: 0; top: 18%; bottom: 18%;
        width: 3.5px; border-radius: 0 4px 4px 0;
        background: var(--accent, var(--amber));
        opacity: .85;
    }

    .ico {
        flex: none; width: 50px; height: 50px; border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        background: var(--grad);
        box-shadow: 0 6px 16px var(--shadow);
    }
    .ico svg { width: 25px; height: 25px; stroke: #fff; stroke-width: 1.9; fill: none;
               stroke-linecap: round; stroke-linejoin: round; }

    .txt { flex: 1; min-width: 0; padding-right: 30px; }
    .txt b {
        display: block; font-size: 17px; font-weight: 700; color: #221D16;
        letter-spacing: .1px; line-height: 1.4;
    }
    .txt i {
        display: block; font-style: normal; font-size: 13px; color: var(--muted);
        margin-top: 3px; line-height: 1.5;
    }
    .arw {
        position: absolute; right: 15px; top: 50%; margin-top: -12px;
        width: 24px; height: 24px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(170, 140, 90, .14);
        transition: background .22s ease, right .22s ease;
    }
    .arw svg { width: 13px; height: 13px; stroke: #836C3C; stroke-width: 2.5; fill: none;
               stroke-linecap: round; stroke-linejoin: round; }
    .card:hover .arw { background: rgba(170, 140, 90, .24); right: 12px; }

    .c1 { --accent: #F0A30A; --grad: linear-gradient(135deg, #FFCB52, #F0990A); --shadow: rgba(220, 150, 10, .34); }
    .c2 { --accent: #E0663F; --grad: linear-gradient(135deg, #F59B78, #DE6239); --shadow: rgba(200, 90, 60, .32); }
    .c3 { --accent: #6E9E7A; --grad: linear-gradient(135deg, #A3C8A6, #6A9A76); --shadow: rgba(90, 140, 100, .30); }

    /* 主推徽标 */
    .tag {
        display: inline-block; vertical-align: 2px;
        margin-left: 7px; padding: 1px 7px 2px;
        font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
        color: #fff; border-radius: 6px; line-height: 1.5;
        background: linear-gradient(135deg, #FF8A3D, #EE6A22);
        box-shadow: 0 2px 7px rgba(230, 100, 30, .28);
    }

    /* ---------- 页脚 ---------- */
    .foot {
        margin-top: auto; padding-top: 46px; text-align: center;
        font-size: 12px; color: #A79E8D; line-height: 2;
    }
    .foot .ln { width: 34px; height: 1px; background: var(--line); margin: 0 auto 16px; }
    .foot a { color: #A79E8D; text-decoration: none; border-bottom: 1px dotted rgba(167,158,141,.5); }

    .toast {
        position: fixed; left: 50%; bottom: 14%; transform: translate(-50%, 8px);
        background: rgba(32, 28, 22, .93); color: #fff;
        padding: 11px 20px; border-radius: 12px; font-size: 13.5px;
        z-index: 9999; opacity: 0; pointer-events: none;
        transition: opacity .24s ease, transform .24s ease;
        max-width: 82%; text-align: center;
        box-shadow: 0 8px 26px rgba(0,0,0,.22);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 380px) {
        .card { padding: 15px 15px; gap: 12px; }
        .ico { width: 44px; height: 44px; border-radius: 14px; }
        .ico svg { width: 22px; height: 22px; }
        .txt b { font-size: 16px; }
        .txt i { font-size: 12.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
        .card { opacity: 1; transform: none; animation: none !important; }
        .card, .arw, .wx .cp { transition: none; }
    }
</style>
